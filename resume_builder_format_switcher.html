<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #334155;
    }

    /* Print styling & optimized multi-page break controls */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 12mm 12mm 12mm !important; /* Standard browser print margin prevents edge clipping */
      }
      
      html, body {
        background-color: #ffffff !important;
        color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print {
        display: none !important;
      }

      .print-container {
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        outline: none !important;
        background: transparent !important;
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
        height: auto !important;
        overflow: visible !important;
      }

      .resume-paper {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 0 !important;
        height: auto !important;
        box-shadow: none !important;
        border: none !important;
        outline: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #ffffff !important;
        box-sizing: border-box !important;
        overflow: visible !important;
        transform: scale(var(--print-scale, 1)) !important;
        transform-origin: top left !important;
      }

      /* Section Table & Card Page Break Safety */
      table.print-section-table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-bottom: 0.5rem !important;
      }
      table.print-section-table thead {
        display: table-header-group !important;
      }
      table.print-section-table tbody {
        display: table-row-group !important;
      }

      /* Strict prevention of element slicing across pages */
      .break-inside-avoid,
      .experience-card,
      .project-card,
      .education-card,
      .award-card,
      tr, li, .section-block {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        -webkit-column-break-inside: avoid !important;
      }

      h1, h2, h3, h4, .section-title {
        break-after: avoid !important;
        page-break-after: avoid !important;
      }

      /* Responsive column flex layout for print engines */
      .print-grid-flow {
        display: flex !important;
        flex-direction: row !important;
        gap: 1.25rem !important;
        align-items: flex-start !important;
      }
      .print-grid-flow > .col-span-8 {
        width: 64% !important;
        flex: 0 0 64% !important;
      }
      .print-grid-flow > .col-span-4 {
        width: 33% !important;
        flex: 0 0 33% !important;
      }

      /* Prevent line orphans and widows at page bottom */
      p, ul, li {
        orphans: 3;
        widows: 3;
      }

      /* Manual forced page break helper class */
      .page-break-before {
        break-before: page !important;
        page-break-before: always !important;
      }
    }

    /* Screen Preview Paper Simulation */
    .resume-paper {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      margin: 0 auto;
      box-sizing: border-box;
      padding: 12mm 14mm;
      transition: all 0.2s ease-in-out;
    }

    /* Density modifiers */
    .density-compact { font-size: 0.82rem; line-height: 1.25; }
    .density-compact .experience-card, .density-compact .project-card { margin-bottom: 0.5rem; }
    
    .density-normal { font-size: 0.88rem; line-height: 1.4; }
    .density-normal .experience-card, .density-normal .project-card { margin-bottom: 0.85rem; }

    .density-relaxed { font-size: 0.95rem; line-height: 1.5; }
    .density-relaxed .experience-card, .density-relaxed .project-card { margin-bottom: 1.2rem; }

    /* Custom Scrollbar for Form Sidebar */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
  </style>
</head>

        </button>
        <button onclick="exportJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">

        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition cursor-pointer">

  <!-- Main Grid Layout -->

    <!-- Sidebar Editor Panel (Left) -->

        <button onclick="switchTab('personal')" id="tab-personal" class="flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition text-indigo-400 bg-slate-800 font-semibold">
          <i class="fa-solid fa-user block mb-1"></i> Profile

        <button onclick="switchTab('experience')" id="tab-experience" class="flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition hover:text-slate-200">

        <button onclick="switchTab('projects')" id="tab-projects" class="flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition hover:text-slate-200">
          <i class="fa-solid fa-diagram-project block mb-1"></i> Projects
        </button>
        <button onclick="switchTab('skills')" id="tab-skills" class="flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition hover:text-slate-200">
          <i class="fa-solid fa-code block mb-1"></i> Skills
        </button>
        <button onclick="switchTab('settings')" id="tab-settings" class="flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition hover:text-slate-200">
          <i class="fa-solid fa-sliders block mb-1"></i> Format

      <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scroll text-xs text-slate-300" id="editorForm">
        <!-- Form rendered dynamically by JavaScript -->

  </div>

    let resumeData = JSON.parse(localStorage.getItem('pankaj_resume_data_v3')) || JSON.parse(JSON.stringify(initialData));

    let currentDensity = 'normal'; // 'compact', 'normal', 'relaxed'
    let currentScale = '1.0';
    let currentTab = 'personal';

    const colorThemes = {
      navy: {
        primary: 'bg-slate-900',
        text: 'text-slate-900',
        border: 'border-slate-900',
        badge: 'bg-slate-100 text-slate-800 border-slate-300'
      },
      emerald: {

      },
      indigo: {

        text: 'text-indigo-700',
        border: 'border-indigo-700',

      },

      },

        text: 'text-rose-800',

      }
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function saveData() {
      localStorage.setItem('pankaj_resume_data', JSON.stringify(resumeData));
      renderPreview();
    }

    function resetData() {
      resumeData = JSON.parse(JSON.stringify(initialData));
      saveData();
      renderEditorForm();
    }

    function switchTab(tab) {
      currentTab = tab;
      ['personal', 'experience', 'projects', 'skills', 'settings'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (btn) {
          if (t === tab) {
            btn.className = "flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition text-indigo-400 bg-slate-800 font-semibold";
          } else {
            btn.className = "flex-1 min-w-[70px] py-2 px-1 text-center rounded-lg transition hover:text-slate-200 text-slate-400";
          }
        }
      });
      renderEditorForm();
    }

    function setPrintScale(scaleVal) {
      currentScale = scaleVal;
      document.documentElement.style.setProperty('--print-scale', scaleVal);
      const paper = document.getElementById('resumePreview');
      if (paper) {
        paper.style.transform = `scale(${scaleVal})`;
        paper.style.transformOrigin = 'top center';
      }
    }

    // Export Data JSON
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resumeData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "resume_data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Import Data JSON
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.personal) {
            resumeData = imported;
            saveData();
            renderEditorForm();
            alert("Resume data imported successfully!");
          } else {
            alert("Invalid resume JSON format.");
          }
        } catch (err) {
          alert("Error parsing JSON file.");
        }
      };
      reader.readAsText(file);
    }

                <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-200 focus:border-indigo-500 outline-none" 
                       value="${escapeHtml(p.phone)}" oninput="resumeData.personal.phone = this.value; saveData();">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">

                <label class="block text-slate-400 mb-1">Location</label>

                       value="${escapeHtml(p.location)}" oninput="resumeData.personal.location = this.value; saveData();">

        `;

            <div class="break-inside-avoid">
              <h2 class="text-xs font-bold uppercase tracking-wider ${theme.text} border-b border-slate-200 pb-0.5 mb-1">Honors & Awards</h2>
              ${resumeData.awards.map(a => `<p class="text-xs text-slate-700"><strong>${escapeHtml(a.title)}</strong> - ${escapeHtml(a.org)} (${escapeHtml(a.date)})</p>`).join('')}
            </div>` : ''}
          </div>
        </div>
      `;
    }

    // Render 3: Minimalist Clean Template
    function renderMinimalTemplate(theme) {
      const p = resumeData.personal || {};
      return `
        <div class="density-${currentDensity} font-sans space-y-5">
          <div class="border-l-4 ${theme.border} pl-3 py-0.5">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">${escapeHtml(p.name)}</h1>
            <p class="text-sm font-medium ${theme.text}">${escapeHtml(p.title)}</p>
            <div class="flex flex-wrap gap-3 text-xs text-slate-500 mt-1.5">
              ${p.email ? `<span><i class="fa-regular fa-envelope mr-1"></i>${escapeHtml(p.email)}</span>` : ''}
              ${p.phone ? `<span><i class="fa-solid fa-mobile-screen mr-1"></i>${escapeHtml(p.phone)}</span>` : ''}
              ${p.location ? `<span><i class="fa-solid fa-location-arrow mr-1"></i>${escapeHtml(p.location)}</span>` : ''}
            </div>
          </div>

          ${p.summary ? `
          <div class="break-inside-avoid bg-slate-50 p-2.5 rounded-r border-l-2 ${theme.border}">
            <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(p.summary)}</p>
          </div>` : ''}

          <!-- Experience Table -->
          <table class="print-section-table w-full text-left">
            <thead>
              <tr>
                <th class="font-normal pb-2">
                  <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">01. Experience</h2>
                </th>
              </tr>
            </thead>
            <tbody>
              ${(resumeData.experiences || []).map(exp => `
                <tr>
                  <td class="pb-3 align-top">
                    <div class="experience-card break-inside-avoid border-l-2 border-slate-100 pl-2.5">
                      <div class="flex justify-between items-baseline">
                        <span class="text-xs font-bold text-slate-800">${escapeHtml(exp.role)} <span class="${theme.text}">@ ${escapeHtml(exp.company)}</span></span>
                        <span class="text-[10px] font-mono text-slate-400">${escapeHtml(exp.period)}</span>
                      </div>
                      <ul class="mt-1 list-disc list-outside pl-4 text-xs text-slate-600 space-y-0.5">
                        ${(exp.bullets || []).map(b => `<li>${escapeHtml(b)}</li>`).join('')}
                      </ul>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <!-- Projects Table -->
          <table class="print-section-table w-full text-left">
            <thead>
              <tr>
                <th class="font-normal pb-2">
                  <h2 class="text-xs font-black uppercase tracking-widest text-slate-400">02. Projects</h2>
                </th>
              </tr>
            </thead>
            <tbody>
              ${(resumeData.projects || []).map(proj => `
                <tr>
                  <td class="pb-2.5 align-top">
                    <div class="project-card break-inside-avoid border border-slate-100 p-2 rounded bg-slate-50/50">
                      <div class="flex justify-between items-baseline">
                        <span class="text-xs font-bold text-slate-800">${escapeHtml(proj.name)}</span>
                        <span class="text-[10px] font-mono text-slate-400">${escapeHtml(proj.period)}</span>
                      </div>
                      <p class="text-xs text-slate-600 mt-0.5">${escapeHtml(proj.desc)}</p>
                      ${proj.tech ? `<p class="text-[10px] ${theme.text} font-mono mt-0.5">${escapeHtml(proj.tech)}</p>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <!-- Skills & Education Grid -->
          <div class="grid grid-cols-2 gap-4 break-inside-avoid print-grid-flow">
            <div>
              <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1.5">03. Technical Stack</h2>
              <div class="flex flex-wrap gap-1">
                ${(resumeData.skills || []).map(s => `<span class="text-[10px] bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded border border-slate-200">${escapeHtml(s)}</span>`).join('')}
              </div>
            </div>
            <div>
              <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1.5">04. Education</h2>
              ${resumeData.education ? `
                <p class="text-xs font-bold text-slate-800">${escapeHtml(resumeData.education.degree)}</p>
                <p class="text-xs text-slate-600">${escapeHtml(resumeData.education.institution)} (${escapeHtml(resumeData.education.period)})</p>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // Render 4: Split Header Template
    function renderSplitTemplate(theme) {
      const p = resumeData.personal || {};
      return `
        <div class="density-${currentDensity} font-sans">
          <div class="${theme.primary} text-white -mx-14 -mt-12 p-6 mb-5">
            <div class="flex justify-between items-center">
              <div>
                <h1 class="text-2xl font-extrabold tracking-tight">${escapeHtml(p.name)}</h1>
                <p class="text-sm font-medium opacity-90 mt-0.5">${escapeHtml(p.title)}</p>
              </div>
              <div class="text-right text-xs opacity-90 space-y-0.5">
                ${p.email ? `<p><i class="fa-solid fa-envelope mr-1"></i>${escapeHtml(p.email)}</p>` : ''}
                ${p.phone ? `<p><i class="fa-solid fa-phone mr-1"></i>${escapeHtml(p.phone)}</p>` : ''}
                ${p.location ? `<p><i class="fa-solid fa-map-pin mr-1"></i>${escapeHtml(p.location)}</p>` : ''}
              </div>
            </div>
          </div>

          <div class="space-y-4">
            ${p.summary ? `
            <div class="break-inside-avoid">
              <h2 class="text-xs font-bold uppercase tracking-wider ${theme.text} border-b pb-0.5 mb-1">About Me</h2>
              <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(p.summary)}</p>
            </div>` : ''}

            <table class="print-section-table w-full text-left">
              <thead>
                <tr>
                  <th class="font-normal pb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider ${theme.text} border-b pb-0.5">Work History</h2>
                  </th>
                </tr>
              </thead>
              <tbody>
                ${(resumeData.experiences || []).map(exp => `
                  <tr>
                    <td class="pb-3 align-top">
                      <div class="experience-card break-inside-avoid bg-slate-50 p-2.5 rounded border border-slate-200">
                        <div class="flex justify-between items-start">
                          <h3 class="text-xs font-bold text-slate-800">${escapeHtml(exp.role)}</h3>
                          <span class="text-[10px] font-semibold ${theme.text}">${escapeHtml(exp.period)}</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-600 mt-0.5">${escapeHtml(exp.company)} — <span class="font-normal">${escapeHtml(exp.location)}</span></p>
                        <ul class="mt-1 list-disc list-outside pl-4 text-xs text-slate-600 space-y-0.5">
                          ${(exp.bullets || []).map(b => `<li>${escapeHtml(b)}</li>`).join('')}
                        </ul>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <table class="print-section-table w-full text-left">
              <thead>
                <tr>
                  <th class="font-normal pb-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider ${theme.text} border-b pb-0.5">Projects</h2>
                  </th>
                </tr>
              </thead>
              <tbody>
                ${(resumeData.projects || []).map(proj => `
                  <tr>
                    <td class="pb-2.5 align-top">
                      <div class="project-card break-inside-avoid bg-white p-2.5 rounded border border-slate-200">
                        <div class="flex justify-between items-baseline">
                          <h3 class="text-xs font-bold text-slate-800">${escapeHtml(proj.name)}</h3>
                          <span class="text-[10px] text-slate-400">${escapeHtml(proj.period)}</span>
                        </div>
                        <p class="text-xs text-slate-600 mt-0.5">${escapeHtml(proj.desc)}</p>
                        ${proj.tech ? `<p class="text-[10px] ${theme.text} font-mono mt-0.5">Tech: ${escapeHtml(proj.tech)}</p>` : ''}
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Main Preview Renderer
    function renderPreview() {
      const container = document.getElementById('resumePreview');
      if (!container) return;

      const theme = colorThemes[currentColor] || colorThemes.navy;
      let html = '';

      if (currentTemplate === 'classic') {
        html = renderClassicTemplate(theme);
      } else if (currentTemplate === 'minimal') {
        html = renderMinimalTemplate(theme);
      } else if (currentTemplate === 'split') {
        html = renderSplitTemplate(theme);
      } else {
        html = renderModernTemplate(theme);
      }

      container.innerHTML = html;
    }

    // Initial load handler
    window.onload = function() {
      renderEditorForm();
      renderPreview();
    };
  </script>
</body>
</html>
